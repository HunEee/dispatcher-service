server:
  port: 9003

spring:
  application:
    name: dispatcher-service
  cloud:
    function: # 스프링 클라우드 함수가 관리할 함수 정의
      definition: pack|label
    stream:
      bindings: # 대상 바인딩 설정
        packlabel-in-0: # 입력바인딩
          destination: order-accepted   # 바인더를 연결한 대상의 브로커 내에서 실제 이름(래빗 MQ의 익스체인지)
          group: ${spring.application.name} # 대상에 관심을 갖는 소비자 그룹(애플리케이션 이름과 동일)
        packlabel-out-0:  # 출력바인딩
          destination: order-dispatched # 바인더를 연결한 대상의 브로커 내에서 실제 이름(래빗 MQ의 익스체인지)
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password
    connection-timeout: 5s
